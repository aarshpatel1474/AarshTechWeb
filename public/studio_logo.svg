<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1138"/>
      <stop offset="50%" stop-color="#0e0720"/>
      <stop offset="100%" stop-color="#070311"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Tech Accent Lines -->
  <path d="M 24 34 L 34 24 M 86 96 L 96 86" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>

  <!-- Modern Stylized "A" Monogram for Aarsh Tech -->
  <path d="M 60 26 L 86 88 L 73 88 L 66 71 L 54 71 L 47 88 L 34 88 Z M 60 45 L 57 60 L 63 60 Z" fill="url(#aGrad)" filter="url(#glow)"/>

  <!-- Core Neon Energy Dot -->
  <circle cx="60" cy="56" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
